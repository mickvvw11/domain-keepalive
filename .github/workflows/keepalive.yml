name: keepalive
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -o /dev/null -w "%{http_code}\n" https://baidu.hidns.cc || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-check.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last-check.txt
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
